<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"></stop>
      <stop offset="100%" stop-color="#312e81"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"></rect>

  <!-- Floating squares -->
  <rect x="200" y="200" width="40" height="40" fill="#4f46e5" opacity="0.5"></rect>
  <rect x="700" y="300" width="30" height="30" fill="#6366f1" opacity="0.5"></rect>
  <rect x="500" y="700" width="35" height="35" fill="#4f46e5" opacity="0.5"></rect>
  <rect x="300" y="600" width="25" height="25" fill="#6366f1" opacity="0.5"></rect>

  <!-- Head silhouette -->
  <circle cx="512" cy="400" r="180" fill="#0f172a"></circle>

  <!-- Question mark -->
  <text x="512" y="470" text-anchor="middle" font-size="260" font-family="Arial, sans-serif" fill="#22d3ee" filter="url(#glow)">?</text>

  <!-- Glow circle -->
  <circle cx="512" cy="400" r="200" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.4"></circle>

  <!-- Title -->
  <text x="512" y="780" text-anchor="middle" font-size="120" font-family="Arial, sans-serif" font-weight="bold" fill="#22d3ee" filter="url(#glow)">
    IMPOSTORE
  </text>
</svg>